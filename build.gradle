import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.time.ZonedDateTime
import java.time.ZoneId
import java.time.format.DateTimeFormatter
import java.util.zip.ZipFile

plugins {
    id 'java'
}

group = 'com.automationanywhere'
version = '1.0.3'
sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

// Generated SDK adapters and package.json were recovered from the published JAR.
// Do not run command-codegen until the source annotations have been restored.
def recoveredDependencies = file('libs/recovery-dependencies-1.0.2.jar')
def sdkJars = files('libs/package-runtime-sdk-1.0.0.jar',
                    'libs/package-compileonly-sdk-1.5.0.jar')
def stamp = ZonedDateTime.now(ZoneId.of('America/Argentina/Buenos_Aires'))
        .format(DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss'))
def aaVersion = providers.gradleProperty('packageVersion').getOrElse("${version}-${stamp}")

if (!(aaVersion == version.toString() || aaVersion.startsWith("${version}-"))) {
    throw new GradleException("packageVersion must start with ${version}")
}

dependencies {
    compileOnly files(recoveredDependencies)
    compileOnly sdkJars
    testImplementation files(recoveredDependencies)
    testImplementation sdkJars
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
    options.compilerArgs += ['-proc:none']
}

tasks.named('processResources') {
    exclude 'package.template'
    inputs.property('aaVersion', aaVersion)
    doLast {
        def packageFile = new File(destinationDir, 'package.json')
        def metadata = new JsonSlurper().parse(packageFile)
        metadata.packageVersion = aaVersion
        metadata.codeVersion = aaVersion
        packageFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + '\n', 'UTF-8')
    }
}

tasks.named('jar') {
    archiveBaseName = project.name
    archiveVersion = aaVersion
    archiveClassifier = ''
    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(zipTree(recoveredDependencies)) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = 'Run recovery regression checks against the packaged JAR.'
    dependsOn tasks.named('jar'), tasks.named('testClasses')
    classpath = files(sourceSets.test.output, tasks.named('jar').flatMap { it.archiveFile }) + configurations.testRuntimeClasspath
    mainClass = 'RecoverySmoke'
}

tasks.register('verifyPackage') {
    group = 'verification'
    description = 'Verify recovered classes, metadata and resources in the output package.'
    dependsOn tasks.named('jar')
    doLast {
        def inventory = new JsonSlurper().parse(file('recovery/inventario-original.json'))
        new ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
            def missing = (inventory.compiledClasses + inventory.extractedResources).findAll { zip.getEntry(it) == null }
            if (missing) throw new GradleException("Missing package entries: ${missing}")
            def meta = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('package.json')))
            if (meta.packageVersion != aaVersion || meta.codeVersion != aaVersion) {
                throw new GradleException('Incorrect package version')
            }
            if (meta.commands != new JsonSlurper().parse(file('src/main/resources/package.json')).commands) {
                throw new GradleException('Command metadata changed during packaging')
            }
            meta.commands.each { cmd ->
                if (zip.getEntry(cmd.mainClass.replace('.', '/') + '.class') == null) {
                    throw new GradleException("Missing command implementation: ${cmd.mainClass}")
                }
            }
            println "Verified ${inventory.compiledClasses.size()} classes and ${meta.commands.size()} commands; version ${aaVersion}"
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('smokeTest'), tasks.named('verifyPackage')
}
